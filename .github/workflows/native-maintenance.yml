name: Nonblocking native maintenance
on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact native source revision to qualify
        required: true
        type: string
  push:
    branches: [fix/nonblocking-maintenance]
permissions:
  contents: read
jobs:
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      # Match the owning Rust CI's stack for unoptimized Core integration tests.
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          repository: compaii/codex
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Format native patch
        run: cargo fmt --all -- --config imports_granularity=Item --check
      - name: Prepare disposable Linux build capacity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y lld pkg-config libssl-dev cmake clang protobuf-compiler libcap-dev
          df -h .
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: interaction-native-linux-1.95-${{ hashFiles('codex-rs/Cargo.lock', '.github/workflows/interaction-goal-controls.yml') }}-${{ github.sha }}
          restore-keys: |
            interaction-native-linux-1.95-${{ hashFiles('codex-rs/Cargo.lock', '.github/workflows/interaction-goal-controls.yml') }}
            interaction-native-linux-1.95-
      - name: Select upstream checksum-verified V8 artifacts for the tool host
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Nonforcing caller and managed transport contracts
        run: |
          cargo test --locked --profile dev-small -j 2 -p codex-app-server-daemon --lib maintenance -- --nocapture
          cargo test --locked --profile dev-small -j 2 -p codex-app-server-daemon --lib scheduled_no_op -- --nocapture
          cargo test --locked --profile dev-small -j 2 -p codex-app-server-daemon --lib manual_update_restarts -- --nocapture
          cargo test --locked --profile dev-small -j 2 -p codex-app-server-transport --lib maintenance -- --nocapture
      - name: Admission, maintenance timeout and explicit shutdown contracts
        run: |
          cargo test --locked --profile dev-small -j 2 -p codex-app-server --lib maintenance -- --nocapture
          cargo test --locked --profile dev-small -j 2 -p codex-app-server --lib shutdown_waits -- --nocapture
          cargo test --locked --profile dev-small -j 2 -p codex-app-server --lib turn_admission -- --nocapture
      - name: Signal-driven process and managed failure regressions
        run: |
          cargo test --locked --profile dev-small -j 2 -p codex-app-server --test all connection_handling_websocket_unix -- --nocapture
          cargo test --locked --profile dev-small -j 2 -p codex-app-server --test all daemon_update_recovery -- --nocapture
      - name: Build the CLI required by Core remote-session fixtures
        run: |
          cargo build --locked --profile dev-small -j 2 -p codex-cli --bin codex
          target/dev-small/codex app-server daemon maintenance --help
      - name: Core input and automatic-start admission contracts
        run: |
          cargo test --locked --profile dev-small -j 2 -p codex-core --lib session::input_queue -- --nocapture
          cargo test --locked --profile dev-small -j 2 -p codex-core --test all turn_input_submission -- --nocapture
      - name: Build the exact native package
        run: |
          cargo build --locked --profile dev-small -j 2 -p codex-code-mode-host --bin codex-code-mode-host
          target/dev-small/codex --version
          sha256sum target/dev-small/codex target/dev-small/codex-code-mode-host
          git rev-parse HEAD > target/dev-small/interaction-source.txt
      - name: Retain native compilation cache
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Retain qualified native package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: nonblocking-maintenance-native-linux
          retention-days: 7
          if-no-files-found: error
          path: |
            codex-rs/target/dev-small/codex
            codex-rs/target/dev-small/codex-code-mode-host
            codex-rs/target/dev-small/interaction-source.txt
